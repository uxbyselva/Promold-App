name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A leaked key cannot be un-leaked, so this runs before anything else.
      - run: ./scripts/scan-secrets.sh

  shared:
    name: Shared package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @promold/shared typecheck
      - run: pnpm --filter @promold/shared test

  schema:
    name: Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Applies every migration to a clean database, loads the seed, and runs
      # the assertion suite. A constraint that stops holding fails here.
      - name: Verify schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
        run: ./scripts/verify-schema.sh
